</style>
<rect width="900" height="598" rx="10" fill="#0f151b"/>
<rect width="900" height="36" rx="10" fill="#161e26"/><rect y="26" width="900" height="10" fill="#161e26"/>
<circle cx="22" cy="18" r="5.5" fill="#3a4753"/><circle cx="42" cy="18" r="5.5" fill="#3a4753"/><circle cx="62" cy="18" r="5.5" fill="#3a4753"/>
<text class="title" x="450.0" y="23" text-anchor="middle">ci-pot with fake sats and real job results</text>
<text class="l0 note" x="26" y="64"># 1. A supporter pays 1000 sat into a repository&#x27;s pot. No account needed.</text>
<text class="l1" x="26" y="85"><tspan class="p">$ </tspan><tspan class="c">curl -X POST $POT/pots/30617:a008def1…:gitworkshop -d &#x27;{&quot;token&quot;:&quot;cashuB…&quot;}&#x27;</tspan></text>
<text class="l2 out" x="26" y="106">accepted: the pot now holds 1000 sat</text>
<text class="l4 note" x="26" y="148"># The same token cannot be paid in twice.</text>
<text class="l5 out" x="26" y="169">refused: this token was already paid in</text>
<text class="l7 note" x="26" y="211"># 2. The repository goes on the coordinator&#x27;s list.</text>
<text class="l8" x="26" y="232"><tspan class="p">$ </tspan><tspan class="c">cat repos.env</tspan></text>
<text class="l9 out" x="26" y="253">NGIT_CI_REPOS=npub15qydau2…2exs5cyejr/gitworkshop</text>
<text class="l11 note" x="26" y="295"># 3. Each finished job is charged to the pot, by the second.</text>
<text class="l12" x="26" y="316"><tspan class="p">$ </tspan><tspan class="c">curl $POT/pots/30617:a008def1…:gitworkshop</tspan></text>
<text class="l13 out" x="26" y="337">balance 902 sat   spent 97 sat   jobs charged 9   served now: yes</text>
<text class="l14 out" x="26" y="358">  charge      10.8 sat   4308554f1b63a13d</text>
<text class="l15 out" x="26" y="379">  charge      13.3 sat   ac7b47516d4f06e5</text>
<text class="l16 out" x="26" y="400">  charge       8.3 sat   eab99a5860ab7bea</text>
<text class="l17 out" x="26" y="421">  charge      11.1 sat   63989ec5c08411a6</text>
<text class="l19 note" x="26" y="463"># 4. The operator is paid for the compute.</text>
<text class="l20" x="26" y="484"><tspan class="p">$ </tspan><tspan class="c">ci-pot wallet --mint $MINT balance</tspan></text>
<text class="l21 out" x="26" y="505">     1000 sat  in the wallet</text>
<text class="l22 out" x="26" y="526">      903 sat  held for pots (paid in, not yet used)</text>
<text class="l23 out" x="26" y="547">       97 sat  earned, free to withdraw</text>
</svg>
